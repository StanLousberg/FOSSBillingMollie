name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP 8.3 / ${{ matrix.database }} / ${{ matrix.host }}
    strategy:
      matrix:
        database: [sqlite, mariadb]
        host: [97bb583dd681e311e2d10fe8c648095f2a479878, main]
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: test-only-password
          MARIADB_DATABASE: molliepayments_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    runs-on: ubuntu-latest
    steps:
      # These are TWO separate Git repositories. FOSSBilling is the test host;
      # it is neither modified in this repo nor used as a submodule.
      - name: Check out MolliePayments
        uses: actions/checkout@v4
        with:
          path: molliepayments

      - name: Check out upstream FOSSBilling
        uses: actions/checkout@v4
        with:
          repository: FOSSBilling/FOSSBilling
          ref: ${{ matrix.host }}
          path: fossbilling

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: curl, intl, mbstring, openssl, pcntl, pdo_mysql, pdo_sqlite, zip, dom, xml
          coverage: none

      - name: Validate MolliePayments Composer metadata
        run: composer validate --strict --no-check-publish --working-dir=molliepayments

      - name: Install MolliePayments SDK
        run: composer install --no-interaction --prefer-dist --no-progress --working-dir=molliepayments

      - name: Verify Mollie SDK autoloads
        run: |
          php -r 'require "molliepayments/module/Molliepayments/vendor/autoload.php"; if (!class_exists("Mollie\\Api\\MollieApiClient")) { exit(1); }'

      - name: Install FOSSBilling dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --working-dir=fossbilling

      # FOSSBilling's tests/Pest.php bootstraps src/load.php, which needs a
      # valid config.php even when every test uses mocks and no DB connection.
      # Materialize the sample once: its salt expression generates a new value
      # on every include, which would break native encryption/decryption.
      - name: Create disposable FOSSBilling test configuration
        run: |
          php -r '$config = require "fossbilling/src/config-sample.php"; file_put_contents("fossbilling/src/config.php", "<?php\n\nreturn " . var_export($config, true) . ";\n");'

      - name: Link MolliePayments into the FOSSBilling test host
        run: |
          ln -s "$GITHUB_WORKSPACE/molliepayments/gateway/MolliePayments.php" \
            "$GITHUB_WORKSPACE/fossbilling/src/library/Payment/Adapter/MolliePayments.php"
          ln -s "$GITHUB_WORKSPACE/molliepayments/gateway" \
            "$GITHUB_WORKSPACE/fossbilling/src/library/Payment/Adapter/MolliePayments"
          ln -s "$GITHUB_WORKSPACE/molliepayments/module/Molliepayments" \
            "$GITHUB_WORKSPACE/fossbilling/src/modules/Molliepayments"

      - name: Check PHP syntax
        run: |
          find molliepayments/gateway molliepayments/module -path '*/vendor' -prune -o -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Check MolliePayments PHP style
        run: fossbilling/src/vendor/bin/php-cs-fixer fix --config=molliepayments/.php-cs-fixer.php --dry-run --diff --sequential

      - name: Run MolliePayments tests with FOSSBilling's Pest framework
        working-directory: fossbilling
        env:
          APP_ENV: test
        run: |
          ./src/vendor/bin/pest \
            --test-directory=../tests \
            --configuration=phpunit.xml.dist \
            src/modules/Molliepayments/tests/Unit

      - name: Run independent-worker MariaDB integration tests
        if: matrix.database == 'mariadb'
        working-directory: fossbilling
        env:
          APP_ENV: test
          MOLLIEPAYMENTS_MYSQL_URL: mysql://root:test-only-password@127.0.0.1:3306/molliepayments_test
        run: |
          ./src/vendor/bin/pest \
            --test-directory=../tests \
            --configuration=phpunit.xml.dist \
            src/modules/Molliepayments/tests/Integration
