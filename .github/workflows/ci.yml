name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP 8.3 / FOSSBilling module tests
    runs-on: ubuntu-latest
    steps:
      # These are TWO separate Git repositories. FOSSBilling is the test host;
      # it is neither modified in this repo nor used as a submodule.
      - name: Check out MolliePayments
        uses: actions/checkout@v4
        with:
          path: molliepayments

      - name: Check out upstream FOSSBilling
        uses: actions/checkout@v4
        with:
          repository: FOSSBilling/FOSSBilling
          path: fossbilling

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: curl, intl, mbstring, openssl, pdo_sqlite, zip, dom, xml
          coverage: none

      - name: Validate MolliePayments Composer metadata
        run: composer validate --no-check-publish --no-check-lock --working-dir=molliepayments

      - name: Install MolliePayments SDK
        run: composer install --no-interaction --prefer-dist --no-progress --working-dir=molliepayments

      - name: Verify Mollie SDK autoloads
        run: |
          php -r 'require "molliepayments/module/Molliepayments/vendor/autoload.php"; if (!class_exists("Mollie\\Api\\MollieApiClient")) { exit(1); }'

      - name: Install FOSSBilling dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --working-dir=fossbilling

      # FOSSBilling's tests/Pest.php bootstraps src/load.php, which needs a
      # valid config.php even when every test uses mocks and no DB connection.
      # We copy the upstream sample only in this disposable CI test checkout.
      - name: Create disposable FOSSBilling test configuration
        run: cp fossbilling/src/config-sample.php fossbilling/src/config.php

      - name: Link MolliePayments into the FOSSBilling test host
        run: |
          ln -s "$GITHUB_WORKSPACE/molliepayments/gateway/MolliePayments.php" \
            "$GITHUB_WORKSPACE/fossbilling/src/library/Payment/Adapter/MolliePayments.php"
          ln -s "$GITHUB_WORKSPACE/molliepayments/gateway" \
            "$GITHUB_WORKSPACE/fossbilling/src/library/Payment/Adapter/MolliePayments"
          ln -s "$GITHUB_WORKSPACE/molliepayments/module/Molliepayments" \
            "$GITHUB_WORKSPACE/fossbilling/src/modules/Molliepayments"

      - name: Check PHP syntax
        run: |
          php -l molliepayments/gateway/MolliePayments.php
          php -l molliepayments/module/Molliepayments/Service.php
          php -l molliepayments/module/Molliepayments/Support/MollieClientFactory.php
          php -l molliepayments/module/Molliepayments/tests/Unit/SdkTest.php
          php -l molliepayments/module/Molliepayments/tests/Unit/SmokeTest.php
          php -l molliepayments/module/Molliepayments/Support/Credentials.php
          php -l molliepayments/module/Molliepayments/Support/ConnectionChecker.php
          php -l molliepayments/module/Molliepayments/Support/SdkUnavailableException.php
          php -l molliepayments/module/Molliepayments/Api/Admin.php
          php -l molliepayments/module/Molliepayments/Support/AdminTwigFactory.php
          php -l molliepayments/module/Molliepayments/tests/Unit/CredentialsTest.php
          php -l molliepayments/module/Molliepayments/tests/Unit/ConnectionTest.php
          php -l molliepayments/module/Molliepayments/tests/Unit/AdminTest.php
          php -l molliepayments/module/Molliepayments/tests/Support.php

      - name: Run MolliePayments tests with FOSSBilling's Pest framework
        working-directory: fossbilling
        env:
          APP_ENV: test
        run: |
          ./src/vendor/bin/pest \
            --test-directory=../tests \
            --configuration=phpunit.xml.dist \
            src/modules/Molliepayments/tests/Unit
